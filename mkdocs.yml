site_name: Tutorial de TwinCAT 3
site_url: https://famoreno.github.io/tc3_tutorial/

exclude_docs: |
  contenidos/ejemplos/carro-basico/includes/**
  contenidos/ejemplos/hola-mundo/includes/**

nav:
    - Inicio: index.md

    - Fundamentos:
      - contenidos/fundamentos/index.md
      - TwinCAT: contenidos/fundamentos/twincat/index.md
      - GRAFCET: contenidos/fundamentos/grafcet/index.md
      - DRC: contenidos/fundamentos/reles-contactos/index.md
      - Lenguajes: contenidos/fundamentos/lenguajes/index.md
      - Arquitecturas: contenidos/fundamentos/arquitecturas/index.md
      - ArduTC: contenidos/fundamentos/ardutc/index.md

    - Procedimientos:
      - contenidos/procedimientos/index.md
      - Crear un Proyecto: contenidos/procedimientos/workflow/index.md
      - Editar un Ladder: contenidos/procedimientos/ladder/index.md
      - Editar un SFC: contenidos/procedimientos/sfc/index.md
      - Crear un HMI:
        - contenidos/procedimientos/hmi/index.md
        - TwinCAT 3 PLC-HMI: contenidos/procedimientos/hmi/tc3-plc-hmi.md
        - TwinCAT 3 HMI: contenidos/procedimientos/hmi/tc3-hmi.md

    - Ejemplos:
      - contenidos/ejemplos/index.md
      - Hola Mundo:
        - contenidos/ejemplos/hola-mundo/index.md
        - Implementación: contenidos/ejemplos/hola-mundo/step-by-step.md
      - Carro Básico:
        - contenidos/ejemplos/carro-basico/index.md
        - Implementación: contenidos/ejemplos/carro-basico/step-by-step.md
      - Carro Extendido:
        - contenidos/ejemplos/carro-extendido/index.md
        - Implementación: contenidos/ejemplos/carro-extendido/step-by-step.md

    - Prácticas:
      - contenidos/practicas/index.md
      - Semáforo de Peatones: contenidos/practicas/semaforo/index.md
      - Proyecto Monolítico: contenidos/practicas/proyectos/proyecto-monolitico.md
      - Proyecto Estructurado: contenidos/practicas/proyectos/proyecto-estructurado.md
      - Proyecto Jerárquico: contenidos/practicas/proyectos/proyecto-jerarquico.md
      - Proyecto Funcional: contenidos/practicas/proyectos/proyecto-funcional.md

    - Licencia:
      - licencia.md

copyright: |
  Material original bajo <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>, excepto código PLC (<a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener">GPLv3</a>) y recursos de terceros.

theme:
  name: material
  language: es
  custom_dir: overrides
  logo: assets/img/auto-isa-team-logo.svg
  favicon: assets/img/auto-isa-team-icon-alt.svg

  palette:
    - scheme: default
      primary: custom #002e5d #blue grey
      # accent: indigo
      toggle:
        icon: fontawesome/solid/moon
        name: Modo oscuro
    - scheme: slate
      primary: custom #002e5d  #blue grey
      # accent: indigo
      toggle:
        icon: fontawesome/solid/sun
        name: Modo claro

  font:
    text: IBM Plex Sans # Roboto
    code: IBM Plex Mono # Roboto Mono

  features:
    - navigation.sections
    - navigation.indexes
    # - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - include-markdown
  - git-revision-date-localized:
      locale: es
      type: date
  - macros:
      include_dir: docs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - abbr
  - pymdownx.snippets:
      check_paths: true
      # base_path: !relative $docs_dir
      base_path: ["."]
      auto_append:
        - snippets/abreviaturas.md
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      # custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/ui-course.js
  - assets/javascripts/tasklist.js
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/creative-commons
      link: https://creativecommons.org/licenses/by-sa/4.0/
      name: Licencia de Contenidos (CC BY-SA 4.0)
    - icon: simple/gnu
      link: https://www.gnu.org/licenses/gpl-3.0.html
      name: Licencia de Código (GPLv3)
