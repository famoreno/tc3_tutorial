name: deploy-mkdocs
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: pip install mkdocs-material mkdocs-macros-plugin mkdocs-include-markdown-plugin mkdocs-git-revision-date-localized-plugin

      - run: mkdocs gh-deploy --force
